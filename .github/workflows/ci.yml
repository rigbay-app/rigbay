name: ci

on:
  push:
    branches: [main]
  pull_request:

# Read-only token, no secrets, nothing is published from this workflow. See docs/CI.md.
permissions:
  contents: read

# A newer run for the same branch or pull request replaces the older one.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET (10 for the host, 8 for the net8.0 modules)
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.x
            10.x

      - name: Build (warnings are errors)
        run: dotnet build Rigbay.sln --no-incremental -warnaserror --nologo

      - name: Test (all test projects, TRX logs)
        run: dotnet test Rigbay.sln --no-build --nologo --logger "trx" --results-directory TestResults

      - name: Upload test logs (only when something failed)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: TestResults/*.trx
          if-no-files-found: ignore
          retention-days: 14

  checks:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.x

      - name: LangCheck, strict, every lang folder
        shell: pwsh
        run: ./tools/ci/langcheck.ps1

      - name: Repository hygiene (no tracked binaries, no token-like strings)
        shell: pwsh
        run: ./tools/ci/scan.ps1

      - name: Relative links in the Markdown files
        shell: pwsh
        run: ./tools/ci/check-links.ps1
