<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="900" viewBox="0 0 1000 900" font-family="Segoe UI Variable Text, Segoe UI, system-ui, sans-serif">
  <title>Sketch 1: module page after (XTU profiles)</title>
  <rect width="1000" height="900" fill="#202020"/>
  <!-- sheet -->
  <rect x="20" y="16" width="820" height="868" rx="8" fill="#272727" stroke="#353535"/>

  <!-- 1 header card: tile, name, live state line, the module switch -->
  <rect x="44" y="36" width="772" height="76" rx="6" fill="#2d2d2d" stroke="#3a3a3a"/>
  <rect x="60" y="50" width="48" height="48" rx="13" fill="#2F7BFF"/>
  <rect x="72" y="64" width="24" height="4" rx="2" fill="#fff"/><circle cx="90" cy="66" r="5" fill="#fff"/>
  <rect x="72" y="80" width="24" height="4" rx="2" fill="#fff"/><circle cx="78" cy="82" r="5" fill="#fff"/>
  <text x="124" y="70" font-size="20" font-weight="600" fill="#ffffff">XTU profiles</text>
  <circle cx="129" cy="90" r="4" fill="#6CCB5F"/>
  <text x="139" y="94" font-size="13" fill="#c5c5c5">Running · Balanced · PL1 55 W, PL2 60 W, 56 s</text>
  <text x="640" y="70" font-size="12" fill="#60cdff">Learn more</text>
  <text x="714" y="70" font-size="12" fill="#60cdff">Log</text>
  <rect x="752" y="76" width="40" height="20" rx="10" fill="#60cdff"/><circle cx="782" cy="86" r="6" fill="#1a1a1a"/>
  <text x="716" y="91" font-size="12" fill="#c5c5c5">On</text>

  <!-- 2 hero: the most used control, big -->
  <rect x="44" y="124" width="772" height="372" rx="6" fill="#2d2d2d" stroke="#3a3a3a"/>
  <text x="60" y="152" font-size="14" font-weight="600" fill="#ffffff">Profile</text>
  <rect x="60" y="164" width="560" height="40" rx="5" fill="#252525" stroke="#3a3a3a"/>
  <text x="96" y="189" font-size="14" fill="#c5c5c5">Quiet</text>
  <rect x="200" y="167" width="140" height="34" rx="4" fill="#3a3a3a"/>
  <rect x="246" y="198" width="48" height="3" rx="1.5" fill="#60cdff"/>
  <text x="236" y="189" font-size="14" font-weight="600" fill="#ffffff">Balanced</text>
  <text x="362" y="189" font-size="14" fill="#c5c5c5">Performance</text>
  <text x="510" y="189" font-size="14" fill="#c5c5c5">Custom...</text>
  <line x1="180" y1="172" x2="180" y2="196" stroke="#3a3a3a"/><line x1="340" y1="172" x2="340" y2="196" stroke="#3a3a3a"/><line x1="480" y1="172" x2="480" y2="196" stroke="#3a3a3a"/>
  <text x="640" y="182" font-size="12" fill="#c5c5c5">Applied 14:02</text>
  <text x="640" y="199" font-size="12" fill="#60cdff">Revert to Quiet</text>

  <!-- tiles are the chart's tabs -->
  <g font-size="12">
    <rect x="60" y="222" width="180" height="84" rx="5" fill="#262626" stroke="#3a3a3a"/>
    <text x="72" y="242" fill="#c5c5c5">CPU temperature</text>
    <text x="72" y="276" font-size="28" font-weight="600" fill="#fff">79</text><text x="108" y="276" fill="#c5c5c5">°C</text>
    <polyline points="140,290 160,286 176,288 192,280 208,282 228,272" fill="none" stroke="#FFA66B" stroke-width="1.5"/>
    <rect x="72" y="296" width="156" height="3" rx="1.5" fill="#3a3a3a"/><rect x="72" y="296" width="123" height="3" rx="1.5" fill="#FFA66B"/>

    <rect x="250" y="222" width="180" height="84" rx="5" fill="#2f3a46" stroke="#60cdff" stroke-width="1.5"/>
    <text x="262" y="242" fill="#ffffff">Package power</text>
    <text x="262" y="276" font-size="28" font-weight="600" fill="#fff">49.2</text><text x="322" y="276" fill="#c5c5c5">W</text>
    <polyline points="340,292 356,284 372,288 388,274 404,278 418,270" fill="none" stroke="#6CB8FF" stroke-width="1.5"/>

    <rect x="440" y="222" width="180" height="84" rx="5" fill="#262626" stroke="#3a3a3a"/>
    <text x="452" y="242" fill="#c5c5c5">CPU usage</text>
    <text x="452" y="276" font-size="28" font-weight="600" fill="#fff">36</text><text x="488" y="276" fill="#c5c5c5">%</text>
    <polyline points="520,290 540,282 556,286 572,276 592,284 608,280" fill="none" stroke="#E5C95C" stroke-width="1.5"/>
    <rect x="452" y="296" width="156" height="3" rx="1.5" fill="#3a3a3a"/><rect x="452" y="296" width="56" height="3" rx="1.5" fill="#E5C95C"/>

    <rect x="630" y="222" width="170" height="84" rx="5" fill="#262626" stroke="#3a3a3a"/>
    <text x="642" y="242" fill="#c5c5c5">Clock, fastest core</text>
    <text x="642" y="276" font-size="28" font-weight="600" fill="#fff">4.2</text><text x="686" y="276" fill="#c5c5c5">GHz</text>
    <polyline points="716,288 732,280 748,284 764,276 788,282" fill="none" stroke="#5FD3C4" stroke-width="1.5"/>
  </g>

  <!-- chart of the selected tile: one series, limits as dashed references -->
  <text x="60" y="334" font-size="12" fill="#c5c5c5">Package power, last 5 minutes</text>
  <text x="694" y="334" font-size="12" fill="#c5c5c5">1   </text><text x="712" y="334" font-size="12" font-weight="600" fill="#fff">5</text><text x="726" y="334" font-size="12" fill="#c5c5c5">  10 min</text>
  <g stroke="#333" stroke-width="1">
    <line x1="92" y1="356" x2="770" y2="356"/><line x1="92" y1="396" x2="770" y2="396"/><line x1="92" y1="436" x2="770" y2="436"/><line x1="92" y1="470" x2="770" y2="470"/>
  </g>
  <g font-size="11" fill="#9a9a9a"><text x="64" y="360">75</text><text x="64" y="400">50</text><text x="64" y="440">25</text><text x="70" y="474">0</text>
    <text x="92" y="488">-5 min</text><text x="420" y="488">-2.5 min</text><text x="748" y="488">now</text></g>
  <line x1="92" y1="384" x2="770" y2="384" stroke="#c5c5c5" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="704" y="380" font-size="11" fill="#c5c5c5">PL2 60 W</text>
  <line x1="92" y1="391" x2="770" y2="391" stroke="#c5c5c5" stroke-width="1" stroke-dasharray="2 3"/>
  <text x="98" y="406" font-size="11" fill="#c5c5c5">PL1 55 W</text>
  <polyline points="92,430 140,420 180,396 220,392 260,393 300,392 340,410 380,440 420,446 460,430 500,404 540,392 580,393 620,402 660,410 700,400 740,398 770,398" fill="none" stroke="#6CB8FF" stroke-width="2"/>
  <circle cx="770" cy="398" r="4" fill="#6CB8FF" stroke="#2d2d2d" stroke-width="2"/>

  <!-- 3 groups of setting rows, shorter copy -->
  <text x="46" y="526" font-size="14" font-weight="600" fill="#fff">Switch by power source</text>
  <rect x="44" y="536" width="772" height="52" rx="5" fill="#2d2d2d" stroke="#3a3a3a"/>
  <text x="60" y="567" font-size="14" fill="#fff">Switch automatically</text>
  <rect x="752" y="552" width="40" height="20" rx="10" fill="none" stroke="#9a9a9a"/><circle cx="762" cy="562" r="5" fill="#c5c5c5"/>
  <rect x="44" y="590" width="772" height="52" rx="5" fill="#2d2d2d" stroke="#3a3a3a" opacity="0.6"/>
  <text x="60" y="621" font-size="14" fill="#9a9a9a">Plugged in</text>
  <rect x="200" y="602" width="200" height="30" rx="4" fill="#333" opacity="0.6"/><text x="212" y="622" font-size="13" fill="#9a9a9a">Performance</text>
  <text x="440" y="621" font-size="14" fill="#9a9a9a">On battery</text>
  <rect x="560" y="602" width="200" height="30" rx="4" fill="#333" opacity="0.6"/><text x="572" y="622" font-size="13" fill="#9a9a9a">Quiet</text>

  <text x="46" y="672" font-size="14" font-weight="600" fill="#fff">Your profiles</text>
  <rect x="44" y="682" width="772" height="52" rx="5" fill="#2d2d2d" stroke="#3a3a3a"/>
  <text x="60" y="713" font-size="14" fill="#fff">Gaming</text><text x="130" y="713" font-size="12" fill="#c5c5c5">PL1 70 W · PL2 90 W · 28 s</text>
  <text x="790" y="713" font-size="14" fill="#c5c5c5">⌄</text>
  <rect x="44" y="736" width="772" height="44" rx="5" fill="#2d2d2d" stroke="#3a3a3a"/>
  <text x="60" y="763" font-size="14" fill="#60cdff">+ New profile</text>

  <rect x="44" y="796" width="772" height="52" rx="5" fill="#2d2d2d" stroke="#3a3a3a"/>
  <text x="60" y="818" font-size="14" fill="#fff">Details</text>
  <text x="60" y="836" font-size="12" fill="#c5c5c5">Throttling, hotkeys, XTU version, restore after restart, per-core readings</text>
  <text x="790" y="828" font-size="14" fill="#c5c5c5">⌄</text>

  <!-- callouts -->
  <g font-size="12" fill="#e6e6e6">
    <circle cx="866" cy="74" r="11" fill="#7A5AF8"/><text x="862" y="78" fill="#fff" font-weight="600">1</text>
    <text x="882" y="70">Switch, state and</text><text x="882" y="85">live line in one card</text>
    <circle cx="866" cy="184" r="11" fill="#7A5AF8"/><text x="862" y="188" fill="#fff" font-weight="600">2</text>
    <text x="882" y="180">Main job first, as a</text><text x="882" y="195">segmented control</text>
    <circle cx="866" cy="264" r="11" fill="#7A5AF8"/><text x="862" y="268" fill="#fff" font-weight="600">3</text>
    <text x="882" y="260">Tiles are the chart's</text><text x="882" y="275">tabs (Task Manager)</text>
    <circle cx="866" cy="392" r="11" fill="#7A5AF8"/><text x="862" y="396" fill="#fff" font-weight="600">4</text>
    <text x="882" y="388">Limits as dashed</text><text x="882" y="403">reference lines</text>
    <circle cx="866" cy="590" r="11" fill="#7A5AF8"/><text x="862" y="594" fill="#fff" font-weight="600">5</text>
    <text x="882" y="586">Related choices on</text><text x="882" y="601">one row</text>
    <circle cx="866" cy="822" r="11" fill="#7A5AF8"/><text x="862" y="826" fill="#fff" font-weight="600">6</text>
    <text x="882" y="818">Facts fold away;</text><text x="882" y="833">no row repeats a tile</text>
  </g>
</svg>
